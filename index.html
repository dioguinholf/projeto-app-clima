<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App de Clima - Portfólio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="weather-card">
        <h2>Previsão do Tempo</h2>
        
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Digite o nome da cidade...">
            <button id="searchBtn">Buscar</button>
        </div>

        <div id="weatherResult" class="weather-result hidden">
            <h3 id="cityName">--</h3>
            <div class="temp">
                <span id="temperature">--</span>°C
            </div>
            <p id="description">--</p>
            <div class="details">
                <p>Umidade: <span id="humidity">--</span>%</p>
            </div>
        </div>

        <p id="errorMessage" class="error-message hidden">Cidade não encontrada. Tente novamente.</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
